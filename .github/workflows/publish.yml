name: Test and publish Docker image
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  publish:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
  verify-public-image:
    if: github.event_name != 'pull_request'
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Pull without registry credentials and test a clean container
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA::7}"
          config="$(mktemp -d)"
          docker --config "$config" pull "$image"
          trap 'docker rm -f photo-journal-public-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name photo-journal-public-smoke \
            --read-only --tmpfs /data:uid=1000,gid=1000,size=32m \
            --tmpfs /tmp:size=32m --cap-drop ALL \
            --security-opt no-new-privileges:true \
            -e ADMIN_PASSWORD="$(openssl rand -hex 24)" \
            -p 127.0.0.1:18789:8789 "$image"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18789/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs photo-journal-public-smoke
          exit 1
