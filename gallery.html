<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>影集</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ee;color:#242924;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}header{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 5vw;border-bottom:1px solid #deded5;font-size:12px;letter-spacing:3px}.brand{font-weight:700}#hero{position:relative;height:min(70vh,700px);min-height:380px;background:#273b32;overflow:hidden;color:white}#hero img{width:100%;height:100%;object-fit:cover;opacity:.8}#hero:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 15%,#10251bc9)}.hero-text{position:absolute;bottom:55px;left:6vw;right:6vw;z-index:1}#title{font-family:Georgia,"Songti SC",serif;font-size:clamp(40px,6vw,82px);font-weight:400;margin:10px 0 20px;letter-spacing:2px}#subtitle{font-size:15px;line-height:1.8;white-space:pre-line;max-width:700px}.eyebrow{font-size:11px;letter-spacing:4px;text-transform:uppercase}.bar{display:flex;justify-content:space-between;align-items:center;margin:40px 5vw 25px;font-size:12px;color:#687268}.bar h2{font-size:18px;color:#273b32;font-weight:500;letter-spacing:2px;margin:0}.dot{width:6px;height:6px;display:inline-block;background:#608068;border-radius:50%;margin-right:7px}main{padding:0 5vw 50px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.tile{display:block;width:100%;border:0;padding:0;margin:0;aspect-ratio:1;background:#e7e8df;cursor:zoom-in;break-inside:avoid;position:relative;overflow:hidden;border-radius:3px}.tile img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .4s}.tile:hover img{transform:scale(1.025)}.tile span{position:absolute;bottom:0;left:0;right:0;padding:25px 14px 12px;background:linear-gradient(transparent,#0008);color:white;font-size:11px;opacity:0;transition:opacity .2s;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tile:hover span{opacity:1}.empty{padding:100px 20px;text-align:center;color:#6a746b}.foot{text-align:center;border-top:1px solid #deded5;padding:28px;font-size:11px;letter-spacing:2px;color:#7a837a}dialog{border:0;max-width:100vw;max-height:100vh;width:100vw;height:100vh;margin:0;padding:0;background:#101411f5;color:white}dialog::backdrop{background:#101411}dialog img{display:block;max-width:92vw;max-height:84vh;object-fit:contain;margin:auto}.viewer{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center}.close,.nav{position:absolute;border:0;background:#ffffff20;color:white;font-size:25px;width:44px;height:44px;border-radius:50%;cursor:pointer}.close{right:22px;top:18px}.nav{top:48%}.prev{left:12px}.next{right:12px}#caption{font-size:12px;margin-top:18px}.error{font-size:13px;color:#9b4b3d}@media(min-width:1600px){.grid{grid-template-columns:repeat(6,minmax(0,1fr))}}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.hero-text{bottom:35px}header{height:56px}#hero{height:55vh;min-height:340px}.bar{margin-top:28px}.bar h2{font-size:16px}.live{font-size:10px}main{padding-left:12px;padding-right:12px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.loadbar{text-align:center;padding:26px 0 5px}.loadmore{background:#294c3a;color:#fff;padding:11px 24px;border:0;border-radius:6px;font:inherit;cursor:pointer}.loadmore:disabled{opacity:.6;cursor:wait}#loadStatus{font-size:12px;color:#768071;margin-top:12px}.original{color:#fff;border:1px solid #ffffff65;border-radius:5px;padding:7px 18px;font-size:13px;text-decoration:none;margin-top:12px}.original:hover{background:#ffffff25}dialog img{max-height:76vh}.viewer{padding:65px 10px 25px}#hero img{opacity:0;transition:opacity .35s}#hero img.ready{opacity:.8}</style><section id="hero"><img id="cover" alt="" hidden><div class="hero-text"><h1 id="title">正在载入影集…</h1><div id="subtitle"></div></div></section><div class="bar"><h2>影像集 <span id="count"></span></h2><span class="live"><i class="dot"></i><span id="sync">自动同步中</span></span></div><main><div id="grid" class="grid"></div><div id="empty" class="empty" hidden>这里的光影，正在路上。<br><small>文件夹中有新照片时会自动出现在这里</small></div><div id="sentinel" class="loadbar"><button id="loadMore" class="loadmore" hidden>加载更多照片</button><div id="loadStatus"></div></div></main><footer class="foot">光影常新 · 记录每一个值得留下的瞬间</footer><dialog id="lightbox"><button class="close" aria-label="关闭">×</button><button class="nav prev" aria-label="上一张">‹</button><div class="viewer"><img id="large" alt=""><div id="caption"></div><a id="original" class="original" target="_blank" rel="noopener noreferrer">查看原图 ↗</a></div><button class="nav next" aria-label="下一张">›</button></dialog><script>
const gid=location.pathname.split('/').filter(Boolean)[1],$=s=>document.querySelector(s),BATCH=24;
let data=null,index=0,busy=false,refreshing=false,retry=false;
const imgurl=(p,kind='thumb')=>'/image/'+encodeURIComponent(gid)+'/'+p.id+'?v='+p.v+(kind==='thumb'?'':'&size='+kind);
function show(i){if(!data?.photos.length)return;index=(i+data.photos.length)%data.photos.length;const p=data.photos[index];$('#large').src=imgurl(p,'large');$('#large').alt=p.name;$('#caption').textContent=(index+1)+' / '+data.count+' · '+p.name;$('#original').hidden=data.allowOriginal===false;$('#original').href='/original/'+encodeURIComponent(gid)+'/'+p.id+'?v='+p.v;if(!$('#lightbox').open)$('#lightbox').showModal()}
$('#lightbox .close').onclick=()=>$('#lightbox').close();$('.prev').onclick=()=>show(index-1);
$('.next').onclick=async()=>{if(data&&index===data.photos.length-1&&data.hasMore){const previous=index;await more();if(data.photos.length>previous+1)show(previous+1)}else show(index+1)};
document.addEventListener('keydown',e=>{if(!$('#lightbox').open)return;if(e.key==='ArrowLeft')$('.prev').click();if(e.key==='ArrowRight')$('.next').click()});
function status(){const n=data?.photos.length||0,total=data?.count||0;$('#loadMore').hidden=!data?.hasMore;$('#loadMore').disabled=busy||refreshing;$('#loadMore').textContent=busy?'正在加载…':'加载更多照片';$('#loadStatus').textContent=data?.indexing?'正在读取拍摄时间，完成后自动显示照片…':total?(n<total?'已加载 '+n+' / '+total+' 张，继续向下浏览':'已展示全部 '+total+' 张照片'):''}
function render(){document.title=data.title+' · 光影';$('#title').textContent=data.title;$('#subtitle').textContent=data.subtitle;$('#count').textContent=' / '+data.count;
 const cover=data.coverPhoto;$('#cover').hidden=!cover;if(cover){const url=imgurl(cover,'cover');if($('#cover').getAttribute('src')!==url){$('#cover').classList.remove('ready');$('#cover').onload=()=>$('#cover').classList.add('ready');$('#cover').onerror=()=>$('#cover').classList.remove('ready');$('#cover').fetchPriority='high';$('#cover').decoding='async';$('#cover').src=url;if($('#cover').complete&&$('#cover').naturalWidth)$('#cover').classList.add('ready')}}
 const existing=new Map([...$('#grid').children].map(n=>[n.dataset.key,n])),frag=document.createDocumentFragment();
 data.photos.forEach((p,i)=>{let b=existing.get(p.id+':'+p.v);if(!b){b=document.createElement('button');b.className='tile';b.dataset.key=p.id+':'+p.v;b.setAttribute('aria-label','查看 '+p.name);const im=new Image();im.loading=i<4?'eager':'lazy';im.decoding='async';im.width=480;im.height=480;im.src=imgurl(p);im.alt=p.name;im.onerror=()=>{im.alt='此照片暂时无法显示'};const label=document.createElement('span');label.textContent=p.name;b.append(im,label)}b.onclick=()=>show(i);frag.append(b)});
 $('#grid').replaceChildren(frag);$('#empty').hidden=data.count>0||data.indexing;status()}
async function page(offset,limit=BATCH){const r=await fetch('/api/gallery/'+gid+'?offset='+offset+'&limit='+limit,{cache:'no-store'});if(!r.ok){if(r.status===404){data=null;$('#grid').replaceChildren();$('#cover').hidden=true;$('#title').textContent='分享已结束';$('#subtitle').textContent='这个影集已被主人取消分享。';$('#lightbox').close();$('#loadMore').hidden=true;$('#loadStatus').textContent=''}throw Error('暂时无法连接')}return r.json()}
async function sync(force=false){if(refreshing)return;refreshing=true;status();try{
 if(data&&!force){const r=await fetch('/api/gallery/'+gid+'?versionOnly=1',{cache:'no-store'});if(r.status===404){await page(0);return}if(!r.ok)throw Error();const v=await r.json();if(v.version===data.version){$('#sync').textContent=data?.indexing?'正在整理照片…':'自动同步 · 每 15 秒更新';return}}
 const target=Math.max(BATCH,data?.photos.length||0),currentId=$('#lightbox').open?data?.photos[index]?.id:null;
 const first=await page(0,Math.min(100,target));let photos=[...first.photos],last=first;
 while(last.hasMore&&photos.length<target){last=await page(photos.length,Math.min(100,target-photos.length));if(last.version!==first.version){retry=true;return}photos.push(...last.photos)}
 data={...first,photos,hasMore:last.hasMore,nextOffset:photos.length};render();$('#sync').textContent=data?.indexing?'正在整理照片…':'自动同步 · 每 15 秒更新';
 if(currentId){const next=data.photos.findIndex(p=>p.id===currentId);if(next>=0)show(next);else $('#lightbox').close()}
 }catch(e){$('#sync').textContent='连接中断，稍后自动重试'}finally{refreshing=false;status();if(retry){retry=false;setTimeout(()=>sync(true),1000)}}}
async function more(){if(busy||refreshing||!data?.hasMore)return;busy=true;status();try{const d=await page(data.photos.length);if(d.version!==data.version){retry=true;return}data.photos.push(...d.photos);data.hasMore=d.hasMore;data.nextOffset=d.nextOffset;render()}catch(e){$('#loadStatus').textContent='加载失败，点击重试'}finally{busy=false;status();if(retry){retry=false;sync(true)}}}
$('#loadMore').onclick=more;
const observer=new IntersectionObserver(entries=>{if(entries.some(e=>e.isIntersecting))more()},{rootMargin:'350px'});observer.observe($('#sentinel'));
sync();setInterval(()=>{if(!document.hidden)sync()},15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
</script></html>
