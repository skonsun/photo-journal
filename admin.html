<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>光影 · 分享管理</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ee;color:#28372d;font:14px/1.7 system-ui,"Microsoft YaHei",sans-serif}header{padding:24px 5vw;background:#fff;border-bottom:1px solid #e0e4db;display:flex;align-items:center;justify-content:space-between}header b{font-size:20px;letter-spacing:2px}main{max-width:1080px;margin:35px auto;padding:0 22px}h1{font-size:30px;font-weight:500;margin:0 0 8px}h2{font-size:20px;margin-top:0}p{color:#768071}.panel{background:#fff;border:1px solid #e0e4db;border-radius:14px;padding:26px;margin:24px 0}.login{max-width:420px;margin:10vh auto}label{display:block;margin:18px 0 6px;font-weight:500}input,textarea,select{width:100%;padding:11px 13px;border:1px solid #d7ddd3;border-radius:7px;background:#fcfcfa;color:#28372d;font:inherit}input:focus,textarea:focus{outline:2px solid #84a891}button,.button{border:0;border-radius:7px;background:#294c3a;color:white;padding:11px 18px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}button:hover{filter:brightness(1.1)}button:disabled{opacity:.5;cursor:wait}.secondary{background:#edf0e9;color:#294c3a}.danger{background:#f7e9e4;color:#a34533}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.notice{font-size:12px;color:#768071}.error{color:#a34533;white-space:pre-line}.folders{max-height:230px;overflow:auto;border:1px solid #e0e4db;border-radius:7px;margin:10px 0}.folder{display:block;width:100%;text-align:left;background:white;color:#294c3a;border-radius:0;border-bottom:1px solid #eee;padding:10px 14px}.folder:hover{background:#f0f3ec}.picked{padding:12px;background:#edf3e9;border-radius:7px;word-break:break-all}.cards{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{padding:22px;margin:0}.card h2{margin:0}.badge{font-size:11px;background:#edf3e9;padding:3px 8px;border-radius:20px}.share{font-size:12px;word-break:break-all;background:#f5f6f0;padding:10px;border-radius:6px;margin:12px 0}.covers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-height:300px;overflow:auto}.cover-choice{padding:0;aspect-ratio:1;background:#eee;border:3px solid transparent;overflow:hidden}.cover-choice img{width:100%;height:100%;object-fit:cover}.cover-choice.selected{border-color:#3a7554}.small{font-size:12px;padding:8px 12px}footer{padding:35px;text-align:center;color:#8a9285;font-size:12px}[hidden]{display:none!important}@media(max-width:650px){.cards{grid-template-columns:1fr}.covers{grid-template-columns:repeat(3,1fr)}header{padding:16px 22px}.panel{padding:20px}.row button{flex-grow:1}}
</style><header><b>光影 · PHOTO JOURNAL</b><button id="logout" class="secondary small" hidden>退出管理</button></header><main>
<section id="login" class="panel login"><h2>管理你的光影</h2><p>创建一个随照片文件夹自动更新的分享影集。</p><form id="loginForm"><label for="password">管理密码</label><input id="password" type="password" autocomplete="current-password" required><button style="width:100%;margin-top:20px">进入管理</button></form><p id="loginError" class="error"></p></section>
<section id="dashboard" hidden><div class="row between"><div><h1>分享影集</h1><p>一个文件夹，一段持续更新的影像故事。</p></div><button id="new">＋ 新建分享</button></div><div id="cards" class="cards"></div><div id="nothing" class="panel" hidden>还没有分享。点击「新建分享」，选择一个文件夹开始。</div></section>
<section id="editor" class="panel" hidden><div class="row between"><h2 id="editorTitle">新建分享影集</h2><button id="cancel" class="secondary small">返回</button></div><form id="editForm"><label for="title">影集标题</label><input id="title" required maxlength="160" placeholder="例如：山海之间 · 2026"><label for="subtitle">封面文案</label><textarea id="subtitle" rows="3" maxlength="600" placeholder="写下一点这组照片的故事"></textarea><label>选择照片文件夹</label><div id="selectedFolder" class="picked"></div><p class="notice">目录仅在管理页显示。会包含所选文件夹及其子文件夹中的照片。</p><div class="row"><button id="up" type="button" class="secondary small">↑ 上一级</button><button id="useFolder" type="button" class="secondary small">选择当前文件夹</button><span id="folderCount" class="notice"></span></div><div id="folders" class="folders"></div><label for="sort">照片排序</label><select id="sort"><option value="taken">拍摄时间从早到晚</option><option value="name">文件名顺序</option><option value="newest">最新修改优先</option></select><label>封面照片</label><p class="notice" id="coverHint">先创建影集，再从该文件夹的照片中选择封面。默认使用第一张照片。</p><div id="covers" class="covers"></div><button id="moreCovers" type="button" class="secondary small" hidden>加载更多封面候选</button><div class="row" style="margin-top:24px"><button id="save">保存并生成分享链接</button><button id="autoCover" type="button" class="secondary">使用第一张作封面</button></div><p id="editError" class="error"></p></form></section>
</main><footer>照片只读接入 · 自动同步 · 取消分享不会删除源文件</footer><script>
const $=s=>document.querySelector(s);let editId='',selected='',browsePath='',cover='',busy=false;
async function api(path,body){const r=await fetch('/api/admin/'+path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}
function view(name){for(const x of ['login','dashboard','editor'])$('#'+x).hidden=x!==name;$('#logout').hidden=name==='login'}
async function dashboard(){try{const d=await api('state');view('dashboard');$('#cards').replaceChildren();$('#nothing').hidden=!!d.galleries.length;for(const g of d.galleries){const card=document.createElement('article');card.className='panel card';const h=document.createElement('h2');h.textContent=g.title;const meta=document.createElement('p');meta.textContent=g.indexing?'正在整理照片拍摄时间…':g.count+' 张照片 · 自动同步';const link=document.createElement('div');link.className='share';const url=location.origin+'/g/'+g.id;link.textContent=url;const row=document.createElement('div');row.className='row';const open=document.createElement('a');open.href=url;open.target='_blank';open.rel='noopener';open.className='button small';open.textContent='预览';const copy=document.createElement('button');copy.className='secondary small';copy.textContent='复制链接';copy.onclick=async()=>{try{await navigator.clipboard.writeText(url);copy.textContent='已复制'}catch(e){prompt('复制这个链接',url)}};const edit=document.createElement('button');edit.className='secondary small';edit.textContent='编辑';edit.onclick=()=>editor(g);const del=document.createElement('button');del.className='danger small';del.textContent='取消分享';del.onclick=async()=>{if(confirm('取消后，原链接立即失效。源照片不会删除。')){await api('delete',{id:g.id});dashboard()}};row.append(open,copy,edit,del);card.append(h,meta,link,row);$('#cards').append(card)}}catch(e){view('login')}}
async function folders(path){try{const d=await api('folders?path='+encodeURIComponent(path));browsePath=d.path;$('#folders').replaceChildren();$('#folderCount').textContent='当前目录有 '+d.count+' 张照片';$('#up').disabled=!path;for(const f of d.folders){const b=document.createElement('button');b.type='button';b.className='folder';b.textContent='▸ '+f.name;b.onclick=()=>folders(f.path);$('#folders').append(b)}if(!d.folders.length){const p=document.createElement('p');p.style.padding='0 14px';p.textContent='没有子文件夹';$('#folders').append(p)}$('#useFolder').textContent='选择当前文件夹：'+(path||'照片库根目录')}catch(e){$('#editError').textContent=e.message}}
async function editor(g=null){editId=g?.id||'';selected=g?.folder||'';cover=g?.cover||'';$('#title').value=g?.title||'';$('#subtitle').value=g?.subtitle||'';$('#sort').value=g?.sort||'taken';$('#selectedFolder').textContent='已选：'+(selected||'照片库根目录');$('#editorTitle').textContent=g?'编辑分享影集':'新建分享影集';$('#save').textContent=g?'保存修改':'保存并生成分享链接';$('#editError').textContent='';$('#covers').replaceChildren();$('#coverHint').textContent=g?'点击一张照片作为封面。':'先创建影集，再编辑选择封面。默认使用第一张照片。';view('editor');await folders(selected);$('#moreCovers').hidden=true;let coverOffset=0;async function fetchCovers(){const d=await fetch('/api/gallery/'+g.id+'?offset='+coverOffset+'&limit=60').then(r=>r.json());coverOffset=d.nextOffset;$('#moreCovers').hidden=!d.hasMore;for(const p of d.photos){const b=document.createElement('button');b.type='button';b.className='cover-choice'+(p.id===cover?' selected':'');b.title=p.name;const im=new Image();im.loading='lazy';im.src='/image/'+g.id+'/'+p.id+'?v='+p.v;im.alt=p.name;b.append(im);b.onclick=()=>{cover=p.id;document.querySelectorAll('.cover-choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};$('#covers').append(b)}}$('#moreCovers').onclick=fetchCovers;if(g)await fetchCovers()}
$('#loginForm').onsubmit=async e=>{e.preventDefault();try{await api('login',{password:$('#password').value});$('#password').value='';dashboard()}catch(e){$('#loginError').textContent=e.message}};
$('#logout').onclick=async()=>{await api('logout',{});view('login')};$('#new').onclick=()=>editor();$('#cancel').onclick=dashboard;$('#up').onclick=()=>folders(browsePath.split('/').slice(0,-1).join('/'));$('#useFolder').onclick=()=>{selected=browsePath;$('#selectedFolder').textContent='已选：'+(selected||'照片库根目录')};$('#autoCover').onclick=()=>{cover='';document.querySelectorAll('.cover-choice').forEach(x=>x.classList.remove('selected'))};
$('#editForm').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;$('#save').disabled=true;try{await api('save',{id:editId,title:$('#title').value,subtitle:$('#subtitle').value,folder:selected,sort:$('#sort').value,cover});await dashboard()}catch(e){$('#editError').textContent=e.message}finally{busy=false;$('#save').disabled=false}};
dashboard();
</script></html>
